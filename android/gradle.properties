org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental caches relativize Pub sources on C: against the app on D:.
# Disable this optimization consistently across plugin/KGP versions on this
# split-drive workspace. Compilation, tests and Gradle up-to-date checks remain.
kotlin.incremental=false
# Built-in Kotlin requires the project's pinned Flutter 3.47+ SDK and AGP 9+.
android.builtInKotlin=true
android.newDsl=false
