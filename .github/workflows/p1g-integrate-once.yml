name: P1G Integrate Once

on:
  push:
    branches:
      - dedal/history-repair-v1
    paths:
      - '.p1g-integrate-trigger'

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedal/history-repair-v1
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Integrate adaptive planner into profile generation
        run: python .agent/p1g_integrate.py
      - name: Format and analyze
        run: |
          dart format lib/services/ai_generation_service.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Commit integration
        run: |
          git config user.name "DEDAL Automation"
          git config user.email "85703541+Ye-Shwethway@users.noreply.github.com"
          git add lib/services/ai_generation_service.dart
          git commit -m "feat: wire adaptive planning into profile quiz generation"
          git push origin HEAD:dedal/history-repair-v1
