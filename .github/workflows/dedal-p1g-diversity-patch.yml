name: DEDAL P1G Diversity Patch

on:
  push:
    branches:
      - dedal/history-repair-v1
    paths:
      - tool/dedal_apply_p1g_diversity.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedal/history-repair-v1
      - name: Apply bounded P1G patch
        run: python3 tool/dedal_apply_p1g_diversity.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Mr. Thorne"
          git config user.email "85703541+Ye-Shwethway@users.noreply.github.com"
          git add lib/services/ai_generation_service.dart lib/screens/quiz_generation_screen.dart
          git commit -m "feat: harden parallel diversity and expose truthful generation mode"
          git push origin HEAD:dedal/history-repair-v1
