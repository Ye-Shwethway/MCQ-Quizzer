name: Agent Fast CI

on:
  push:
    branches:
      - 'codex/**'
      - 'dedal/**'
    paths:
      - 'lib/**'
      - 'test/p1r_timer_persistence_test.dart'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

concurrency:
  group: agent-fast-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Keep this lane lightweight. Manual APK testing is the primary feature
      # acceptance loop; analyzer errors remain fatal while legacy warnings do not.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # P1R has timing/process-death behavior that is tedious to exercise by hand.
      # Keep this deliberately narrow rather than turning the full legacy suite
      # into a delivery gate.
      - name: Focused P1R persistence tests
        run: flutter test test/p1r_timer_persistence_test.dart
