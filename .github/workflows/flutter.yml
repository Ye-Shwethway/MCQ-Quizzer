name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    # Keep this check name stable because main branch protection requires it.
    name: Analyze & Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep CI identical to the toolchain pinned in flutter-toolchain.json.
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Existing warnings/info are non-fatal. APK/manual phone validation is the
        # active delivery gate for UI/behavior slices.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
