name: DEDAL Apply Quiz UX Refinement

on:
  push:
    branches:
      - 'dedal/agent-work'
    paths:
      - '.github/workflows/dedal-apply-refinement.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedal/agent-work

      - name: Apply approved refinement slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Quiz Generation: AI-first ordering while retaining the same two-tab UI.
          replace_once(
              'lib/screens/quiz_generation_screen.dart',
              """                Expanded(\n                  child: _buildTabButton(\n                    index: 0,\n                    icon: Icons.upload_file,\n                    label: 'Manual Upload',\n                  ),\n                ),\n                Expanded(\n                  child: _buildTabButton(\n                    index: 1,\n                    icon: Icons.auto_awesome,\n                    label: 'AI Generation',\n                  ),\n                ),""",
              """                Expanded(\n                  child: _buildTabButton(\n                    index: 0,\n                    icon: Icons.auto_awesome,\n                    label: 'AI Generation',\n                  ),\n                ),\n                Expanded(\n                  child: _buildTabButton(\n                    index: 1,\n                    icon: Icons.upload_file,\n                    label: 'Manual Upload',\n                  ),\n                ),""",
              'generation tab order',
          )
          replace_once(
              'lib/screens/quiz_generation_screen.dart',
              """          Expanded(\n            child: _selectedIndex == 0\n                ? const _ManualUploadTab()\n                : const _AIGenerationTab(),\n          ),""",
              """          Expanded(\n            child: _selectedIndex == 0\n                ? const _AIGenerationTab()\n                : const _ManualUploadTab(),\n          ),""",
              'generation tab body order',
          )

          # Quiz Library: AI-first ordering. This also makes View in Library land on
          # the correct tab because /library now defaults to index 0 = AI Generated.
          replace_once(
              'lib/screens/quiz_library_screen.dart',
              """                  Tab(\n                    icon: const Icon(Icons.upload_file),\n                    text: 'Uploaded (${_uploadedQuizSets.length})',\n                  ),\n                  Tab(\n                    icon: const Icon(Icons.auto_awesome),\n                    text: 'AI Generated (${_aiGeneratedQuizSets.length})',\n                  ),""",
              """                  Tab(\n                    icon: const Icon(Icons.auto_awesome),\n                    text: 'AI Generated (${_aiGeneratedQuizSets.length})',\n                  ),\n                  Tab(\n                    icon: const Icon(Icons.upload_file),\n                    text: 'Uploaded (${_uploadedQuizSets.length})',\n                  ),""",
              'library tab order',
          )
          replace_once(
              'lib/screens/quiz_library_screen.dart',
              """          : _quizSets.isEmpty\n          ? _buildEmptyState('uploaded')\n          : TabBarView(\n              controller: _tabController,\n              children: [\n                _buildQuizListView(_uploadedQuizSets, 'uploaded'),\n                _buildQuizListView(_aiGeneratedQuizSets, 'ai_generated'),\n              ],\n            ),""",
              """          : _quizSets.isEmpty\n          ? _buildEmptyState('ai_generated')\n          : TabBarView(\n              controller: _tabController,\n              children: [\n                _buildQuizListView(_aiGeneratedQuizSets, 'ai_generated'),\n                _buildQuizListView(_uploadedQuizSets, 'uploaded'),\n              ],\n            ),""",
              'library tab body order',
          )
          replace_once(
              'lib/screens/quiz_library_screen.dart',
              """            onPressed: () {\n              Navigator.pushNamed(context, '/generation');\n            },""",
              """            onPressed: () {\n              Navigator.pushNamed(\n                context,\n                isUploaded ? '/upload' : '/generation',\n              );\n            },""",
              'library empty-state route',
          )

          # In-quiz smart stem pane.
          replace_once(
              'lib/screens/quiz_screen.dart',
              """  QuizProvider? _provider;\n  bool _expiryDialogShown = false;""",
              """  QuizProvider? _provider;\n  bool _expiryDialogShown = false;\n  final ScrollController _questionScrollController = ScrollController();\n  bool _showCompactStem = false;""",
              'quiz scroll state',
          )
          replace_once(
              'lib/screens/quiz_screen.dart',
              """    WidgetsBinding.instance.addObserver(this);\n    // Set up timer expiration callback""",
              """    WidgetsBinding.instance.addObserver(this);\n    _questionScrollController.addListener(_handleQuestionScroll);\n    // Set up timer expiration callback""",
              'quiz scroll listener init',
          )
          replace_once(
              'lib/screens/quiz_screen.dart',
              """    WidgetsBinding.instance.removeObserver(this);\n    _provider?.setTimerExpiredCallback(null);\n    super.dispose();""",
              """    WidgetsBinding.instance.removeObserver(this);\n    _provider?.setTimerExpiredCallback(null);\n    _questionScrollController.removeListener(_handleQuestionScroll);\n    _questionScrollController.dispose();\n    super.dispose();""",
              'quiz scroll listener dispose',
          )
          replace_once(
              'lib/screens/quiz_screen.dart',
              """                Expanded(\n                  child: SingleChildScrollView(\n                    padding: const EdgeInsets.all(16.0),""",
              """                AnimatedSwitcher(\n                  duration: const Duration(milliseconds: 180),\n                  child: _showCompactStem\n                      ? Material(\n                          key: ValueKey(\n                            'compact-stem-${quizProvider.currentQuestionIndex}',\n                          ),\n                          color: Theme.of(context)\n                              .colorScheme\n                              .surfaceContainerHigh,\n                          child: InkWell(\n                            onTap: () => _showQuestionStemOverlay(\n                              context,\n                              quizProvider,\n                            ),\n                            child: Padding(\n                              padding: const EdgeInsets.symmetric(\n                                horizontal: 16,\n                                vertical: 10,\n                              ),\n                              child: Row(\n                                children: [\n                                  Expanded(\n                                    child: Column(\n                                      crossAxisAlignment:\n                                          CrossAxisAlignment.start,\n                                      children: [\n                                        Text(\n                                          'Question ${quizProvider.currentQuestionIndex + 1} · Tap to expand',\n                                          style: Theme.of(context)\n                                              .textTheme\n                                              .labelSmall\n                                              ?.copyWith(\n                                                color: Theme.of(context)\n                                                    .colorScheme\n                                                    .primary,\n                                                fontWeight: FontWeight.w600,\n                                              ),\n                                        ),\n                                        const SizedBox(height: 2),\n                                        Text(\n                                          quizProvider.currentQuestion!\n                                              .questionText,\n                                          maxLines: 2,\n                                          overflow: TextOverflow.ellipsis,\n                                          style: Theme.of(context)\n                                              .textTheme\n                                              .bodyMedium\n                                              ?.copyWith(\n                                                fontWeight: FontWeight.w600,\n                                              ),\n                                        ),\n                                      ],\n                                    ),\n                                  ),\n                                  const SizedBox(width: 12),\n                                  const Icon(Icons.open_in_full, size: 20),\n                                ],\n                              ),\n                            ),\n                          ),\n                        )\n                      : const SizedBox.shrink(\n                          key: ValueKey('compact-stem-hidden'),\n                        ),\n                ),\n                Expanded(\n                  child: SingleChildScrollView(\n                    controller: _questionScrollController,\n                    padding: const EdgeInsets.all(16.0),""",
              'compact stem pane',
          )

          # Add a thin divider after each branch. Keeping the branch widgets intact
          # minimizes risk while making adjacent A-E rows easier to distinguish.
          quiz_path = Path('lib/screens/quiz_screen.dart')
          quiz_text = quiz_path.read_text()
          branch_start = quiz_text.index('                        ...List.generate(5, (index) {')
          branch_end_marker = '                        }),\n                      ],'
          branch_end = quiz_text.index(branch_end_marker, branch_start)
          quiz_text = (
              quiz_text[:branch_end]
              + """                        }).expand((branch) sync* {\n                          yield branch;\n                          yield Divider(\n                            height: 20,\n                            thickness: 0.7,\n                            color: Theme.of(context)\n                                .colorScheme\n                                .outlineVariant\n                                .withOpacity(0.75),\n                          );\n                        }),\n                      ],"""
              + quiz_text[branch_end + len(branch_end_marker):]
          )
          quiz_path.write_text(quiz_text)

          replace_once(
              'lib/screens/quiz_screen.dart',
              """                        onPressed: quizProvider.currentQuestionIndex > 0\n                            ? () => quizProvider.previousQuestion()\n                            : null,""",
              """                        onPressed: quizProvider.currentQuestionIndex > 0\n                            ? () {\n                                quizProvider.previousQuestion();\n                                _resetQuestionScroll();\n                              }\n                            : null,""",
              'previous question reset',
          )
          replace_once(
              'lib/screens/quiz_screen.dart',
              """                            ? () => quizProvider.nextQuestion()\n                            : () => _navigateToResults(context, quizProvider),""",
              """                            ? () {\n                                quizProvider.nextQuestion();\n                                _resetQuestionScroll();\n                              }\n                            : () => _navigateToResults(context, quizProvider),""",
              'next question reset',
          )
          replace_once(
              'lib/screens/quiz_screen.dart',
              """                quizProvider.goToQuestion(targetIndex);\n                Navigator.of(dialogContext).pop();""",
              """                quizProvider.goToQuestion(targetIndex);\n                _resetQuestionScroll();\n                Navigator.of(dialogContext).pop();""",
              'goto question reset',
          )
          replace_once(
              'lib/screens/quiz_screen.dart',
              """  void _showGoToDialog(BuildContext context, QuizProvider quizProvider) {""",
              """  void _handleQuestionScroll() {\n    if (!_questionScrollController.hasClients) return;\n    final shouldShow = _questionScrollController.offset > 120;\n    if (shouldShow != _showCompactStem && mounted) {\n      setState(() => _showCompactStem = shouldShow);\n    }\n  }\n\n  void _resetQuestionScroll() {\n    if (_showCompactStem && mounted) {\n      setState(() => _showCompactStem = false);\n    }\n    if (_questionScrollController.hasClients) {\n      _questionScrollController.animateTo(\n        0,\n        duration: const Duration(milliseconds: 180),\n        curve: Curves.easeOut,\n      );\n    }\n  }\n\n  void _showQuestionStemOverlay(\n    BuildContext context,\n    QuizProvider quizProvider,\n  ) {\n    final stem = quizProvider.currentQuestion?.questionText;\n    if (stem == null || stem.isEmpty) return;\n\n    showDialog(\n      context: context,\n      builder: (dialogContext) => AlertDialog(\n        title: Text('Question ${quizProvider.currentQuestionIndex + 1}'),\n        content: ConstrainedBox(\n          constraints: BoxConstraints(\n            maxHeight: MediaQuery.sizeOf(dialogContext).height * 0.62,\n          ),\n          child: SingleChildScrollView(\n            child: SelectableText(\n              stem,\n              style: Theme.of(dialogContext).textTheme.bodyLarge,\n            ),\n          ),\n        ),\n        actions: [\n          TextButton(\n            onPressed: () => Navigator.of(dialogContext).pop(),\n            child: const Text('Close'),\n          ),\n        ],\n      ),\n    );\n  }\n\n  void _showGoToDialog(BuildContext context, QuizProvider quizProvider) {""",
              'quiz stem helpers',
          )

          # Phone checkpoint version bump.
          pubspec = Path('pubspec.yaml')
          pub_text = pubspec.read_text()
          if 'version: 1.0.0+2' not in pub_text:
              raise SystemExit('pubspec version +2 not found')
          pubspec.write_text(pub_text.replace('version: 1.0.0+2', 'version: 1.0.0+3', 1))

          # Durable documentation for the approved UX direction and workflow.
          Path('docs/QUIZ_UX_REFINEMENT.md').write_text("""# Quiz UX Refinement — AI-first tabs and smart question stem\n\nUpdated: 2026-09-11\nBranch: `dedal/agent-work`\nCheckpoint target: `1.0.0+3`\n\n## Owner-approved scope\n\nThis slice follows the successful manual phone test of the multi-model provider and AI quiz generation flow in `1.0.0+2`. The goal is refinement rather than a provider-model redesign.\n\n### AI-first navigation\n- Quiz Generation places **AI Generation** first and **Manual Upload** second.\n- Quiz Library places **AI Generated** first and **Uploaded** second.\n- The AI generation success action `View in Library` continues to navigate to `/library`; because the Library now defaults to the first AI tab, the generated quiz opens in the expected section instead of Uploaded.\n- The Uploaded empty state routes directly to `/upload`, while the AI empty state routes to `/generation`.\n\n### Smart question-stem pane\n- The full question stem remains in the normal scroll content at the top of each question.\n- Once the user scrolls beyond the stem area, a compact sticky pane appears above the branch-answer scroll region.\n- The compact pane is intentionally small: question number, a two-line stem preview, and a tap-to-expand affordance.\n- Tapping it opens a scrollable full-stem overlay so long clinical stems remain readable on small phones without permanently consuming the viewport.\n- Moving Previous / Next / Go-to-question resets the question scroll to the top and hides the compact pane for the new question.\n\n### Branch separation\n- A subtle `outlineVariant` divider is inserted between branch answer rows.\n- Existing answer controls and scoring behavior are not redesigned in this slice.\n- The goal is clearer A–E visual grouping without turning every branch into a heavy card.\n\n## Validation policy\n\nThis project is now APK-first for meaningful UI slices. `Agent Fast CI` is analyze-only; `flutter test` is not a delivery gate. The acceptance loop is:\n\n`implement -> flutter analyze -> arm64 debug APK -> Owner phone test -> targeted bug fix`\n\nAutomated tests may be added later only when they clearly protect a real bug/regression and do not slow feature delivery.\n\n## Phone test checklist\n1. Quiz Generation opens on AI Generation; Manual Upload is second.\n2. Quiz Library opens on AI Generated; Uploaded is second.\n3. Generate a quiz and tap View in Library; the new quiz is visible immediately in AI Generated.\n4. Start a quiz with a long stem; scroll until the full stem leaves view and verify the compact stem pane appears.\n5. Tap the compact pane and verify the full stem opens in a readable scrollable overlay.\n6. Confirm branch rows are visually separated by thin dividers.\n7. Move Previous / Next / Go-to-question and verify the new question returns to the top of its stem.\n8. Smoke-check answer selection, Show Correct Answers, save/exit, and result navigation.\n""")

          Path('.agent/status/dedal.md').write_text("""# DEDAL Status\n\nState: active implementation; APK-first manual validation.\nBranch: `dedal/agent-work`\nCurrent task: Owner-approved quiz UX refinement after successful `1.0.0+2` phone test.\nFiles/Area: `lib/screens/quiz_generation_screen.dart`, `lib/screens/quiz_library_screen.dart`, `lib/screens/quiz_screen.dart`, continuity docs, and APK checkpoint workflow.\nLast checkpoint: `1.0.0+2` manually validated by Owner with provider multi-model save/switch, AI quiz generation, AI library storage, and quiz launch working without observed bugs. Test-suite delivery gating was retired; Agent Fast CI is analyze-only.\nCurrent slice: AI-first Generation/Library tab order, correct generated-quiz Library landing, compact smart question-stem pane with expandable full-text overlay, and thin branch separators.\nNext: analyze this slice, build `1.0.0+3` arm64 debug APK, Owner phone-test the listed UX behaviors, then fix only observed regressions before moving to the next refinement.\n""")

          Path('docs/continuity/CURRENT_CHECKPOINT.md').write_text("""# Current Checkpoint\n\nUpdated: 2026-09-11\n\n## Active branch\n`dedal/agent-work`\n\n## Current feature\nQuiz UX refinement after successful manual validation of the multi-model AI provider and generation flow.\n\nImplementation note: `docs/QUIZ_UX_REFINEMENT.md`\n\n## Completed before this slice\n- Multi-model provider schema/storage/editor and verified saved-model quick switching are implemented.\n- AI Quiz Generation uses the selected verified saved model.\n- `1.0.0+2` arm64 debug APK built successfully and was manually tested by the Owner; no bug was observed in the exercised provider/generation/library/quiz flow.\n- The experimental multi-model regression test was removed.\n- Agent Fast CI no longer runs `flutter test`; analyzer-only CI plus APK/manual phone validation is the delivery loop.\n\n## Current refinement slice\n- AI Generation becomes the first Quiz Generation tab; Manual Upload moves second.\n- AI Generated becomes the first Quiz Library tab; Uploaded moves second.\n- `View in Library` after AI generation therefore lands directly on the AI Generated section.\n- In-quiz long stems gain a compact sticky preview after scrolling, with tap-to-expand full-stem overlay.\n- Branch answer rows gain subtle thin dividers for clearer A-E separation.\n- Previous / Next / Go-to-question reset to the top of the newly selected question.\n\n## Validation and build discipline\nNormal loop: implement a coherent UI slice -> `flutter analyze` -> `[apk]` arm64 debug build -> Owner phone test -> targeted fix. Do not create automated tests as a delivery gate unless a specific observed regression clearly benefits from one.\n\n## Immediate next work\n1. Validate this refinement slice with analyzer-only CI.\n2. Build and deliver checkpoint `1.0.0+3`.\n3. Owner manually checks AI-first tabs, generated-quiz landing, smart stem pane/overlay, branch separators, and normal quiz answering/navigation.\n4. Fix only real observed issues, then choose the next refinement slice.\n""")

          decisions = Path('docs/continuity/DECISIONS.md')
          d = decisions.read_text()
          old = """## Build/test workflow\n- Use fast CI for ordinary agent-branch code pushes: `flutter analyze` + `flutter test`.\n- Do not build/install an APK for every micro-fix.\n- Batch related implementation and fixes into a meaningful, phone-testable checkpoint.\n- On `dedal/*` and `codex/*`, the slow Android APK job runs only when the pushed checkpoint commit message contains `[apk]` or when `workflow_dispatch` is used deliberately.\n- `main` remains allowed to build an APK automatically after Owner-approved changes.\n- APK artifacts are arm64 debug builds for the primary phone-test workflow.\n- When an APK build is green, fetch the artifact, verify the actual APK size, and give the Owner a direct download link without waiting to be asked.\n- While an APK build is running, avoid unnecessary replacement pushes. Cancel/replace only when a newer urgent fix invalidates that build.\n- Docs-only and coordination-only changes must not trigger APK builds.\n"""
          new = """## Build/test workflow\n- **APK-first/manual acceptance is the project delivery loop for meaningful UI and behavior slices.**\n- Agent Fast CI is analyzer-only (`flutter analyze --no-fatal-infos --no-fatal-warnings`); `flutter test` is not a delivery gate.\n- Do not add tests for every feature or migration edge case. Add targeted automated tests later only when they clearly protect a real observed bug/regression and do not slow delivery.\n- Batch related implementation into a meaningful phone-testable checkpoint, then build an arm64 debug APK and let the Owner test on device.\n- If CI/test debugging would take longer than producing an APK for manual validation, switch to APK-first immediately.\n- On `dedal/*` and `codex/*`, the Android APK job runs when a qualifying source push contains `[apk]` or when `workflow_dispatch` is used deliberately.\n- `main` remains Owner-controlled; agents do not merge their own work without explicit approval.\n- When an APK build is green, fetch the artifact and give the Owner a direct download link.\n- Docs-only and coordination-only changes must not trigger APK builds.\n"""
          if old not in d:
              raise SystemExit('DECISIONS build/test section did not match expected content')
          decisions.write_text(d.replace(old, new, 1))

          # Remove this one-shot workflow from the final implementation commit.
          Path('.github/workflows/dedal-apply-refinement.yml').unlink()
          PY

      - name: Commit refinement and trigger APK checkpoint
        shell: bash
        run: |
          git config user.name "DEDAL"
          git config user.email "85703541+Ye-Shwethway@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine AI-first quiz UX and sticky stem [apk]"
          git push origin HEAD:dedal/agent-work
