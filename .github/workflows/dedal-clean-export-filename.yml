name: DEDAL Clean Export Filename

on:
  push:
    branches:
      - dedal/history-repair-v1
    paths:
      - tool/dedal_clean_export_filename.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dedal/history-repair-v1
      - name: Apply export filename cleanup
        run: python3 tool/dedal_clean_export_filename.py
      - name: Commit product fix
        run: |
          if git diff --quiet -- lib/services/export_service.dart; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "Mr. Thorne"
          git config user.email "85703541+Ye-Shwethway@users.noreply.github.com"
          git add lib/services/export_service.dart
          git commit -m "fix: clean default export filenames"
          git push origin HEAD:dedal/history-repair-v1
